<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Five Star · CRM Design Hub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>★</text></svg>">
<link rel="stylesheet" href="app.css?v=3">
</head>
<body data-group="all">
<header class="app-bar">
  <button class="app-menu" id="app-menu" aria-label="Show navigation" aria-expanded="false">☰</button>
  <a class="mh-brand" href="#/overview"><i class="star" aria-hidden="true" style="font-style:normal">★</i><b>Five Star</b><span class="sub">CRM Design Hub</span></a>
  <div class="group-seg" id="group-seg" role="group" aria-label="Filter by brand"></div>
  <button class="topbtn" type="button" data-copy>Copy link</button>
  <span class="mh-chip">Working draft</span>
</header>
<div class="app-grid">
  <nav class="app-nav" id="app-nav" aria-label="Hub navigation">
    <input class="app-filter" id="app-filter" type="search" placeholder="Filter the menu" aria-label="Filter the menu">
    <div id="app-tree" class="tree"></div>
  </nav>
  <main class="app-main" id="app-main" tabindex="-1"></main>
</div>
<aside class="app-drawer" id="app-drawer" aria-hidden="true" aria-labelledby="drawer-title">
  <div class="drawer-head">
    <div><h2 id="drawer-title"></h2><div class="drawer-sub" id="drawer-sub"></div><div class="drawer-tools"><button class="linkbtn" type="button" data-copy>Copy link</button></div></div>
    <button class="drawer-close" id="drawer-close" aria-label="Close the details">×</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>
<div id="chart-tip" class="chart-tip" hidden></div>
<div class="gate" id="gate" hidden>
  <form class="gate-card" id="gate-form" autocomplete="off">
    <h1>CRM Design Hub</h1>
    <p>Five Star · enter the hub password.</p>
    <label for="gate-pw">Password</label>
    <input id="gate-pw" type="password" required autocomplete="current-password">
    <button class="btn" type="submit">Open the hub</button>
    <p class="gate-msg" id="gate-msg" role="status" aria-live="polite"></p>
  </form>
</div>
<script src="gate.js?v=3"></script>
<script src="review.config.js?v=1"></script>
<script src="review-bootstrap.js?v=1"></script>
</body>
</html>
